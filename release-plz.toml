[workspace]
release_always = false
pr_name = "{% if package and version %}{{ package }}: release v{{ version }}{% else %}repo: release{% endif %}"
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }}-v{{ version }}"

[changelog]
commit_parsers = [
    { message = "^release", skip = true },
    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: fix", group = "Fixed" },
    { message = "^.*", group = "Changed" },
]

[[package]]
name = "omaha"
release = false

[[package]]
name = "omaha-diff"
release = false

[[package]]
name = "omaha-publish"
release = false

[[package]]
name = "omaha-server"
release = false
