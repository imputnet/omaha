name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: check
    if: github.repository_owner == 'imputnet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: check for a merged release pr
        id: check
        run: .github/scripts/is-release-commit.sh
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: release
        uses: release-plz/action@v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: release pr
    if: github.repository_owner == 'imputnet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: create app token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: release pr
        uses: release-plz/action@v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
