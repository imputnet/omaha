name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Publishes crates whose release PR was just merged.
  release:
    name: release
    if: >-
      github.repository_owner == 'imputnet' &&
      (startsWith(github.event.head_commit.message, 'release') ||
       contains(github.event.head_commit.message, 'release-plz-'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # push tags and create GitHub releases
      contents: write
      # find the release PR the commit came from
      pull-requests: read
      # crates.io trusted publishing
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens or updates the release PR with version bumps and changelogs.
  release-pr:
    name: release pr
    if: github.repository_owner == 'imputnet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: release pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
