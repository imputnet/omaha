name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: test
        run: .github/scripts/test.sh

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: check dependencies
        run: .github/scripts/deny.sh

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: audit workflows
        run: .github/scripts/zizmor.sh

      - name: check the actions lockfile
        run: .github/scripts/actions-lock.sh

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: check build
        run: .github/scripts/msrv.sh

  conformance:
    name: conformance (chrome ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [Stable, Beta]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: run a browser against omaha-server
        env:
          CHROME_CHANNEL: ${{ matrix.channel }}
        run: .github/scripts/conformance.sh
