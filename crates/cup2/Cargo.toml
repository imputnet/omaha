[package]
name = "cup2"
description = "Chromium's Client Update Protocol (CUP2): signing and verifying update responses"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
exclude = ["tests/chromium.rs"]
license.workspace = true
repository.workspace = true
keywords = ["chromium", "cup", "omaha", "signature"]
categories = ["cryptography"]

[dependencies]
sha2.workspace = true
aws-lc-rs = { workspace = true, optional = true }

[features]
default = ["aws-lc"]
aws-lc = ["dep:aws-lc-rs"]

[lints]
workspace = true

[dev-dependencies]
chromium-testdata.workspace = true
