[package]
name = "crx3"
description = "Chromium CRX3 package format: IDs, headers, signing and verification"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
exclude = ["tests/chromium.rs"]
license.workspace = true
repository.workspace = true
keywords = ["chromium", "crx", "extension", "crx3"]
categories = ["parser-implementations", "encoding"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
sha2.workspace = true
aws-lc-rs = { workspace = true, optional = true }

[features]
default = ["aws-lc"]
aws-lc = ["dep:aws-lc-rs"]

[lints]
workspace = true

[dev-dependencies]
chromium-testdata.workspace = true
sha2 = { workspace = true, features = ["std"] }
