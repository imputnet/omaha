[workspace]
exclude = ["fuzz"]
resolver = "3"
members = ["crates/*", "support/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imputnet/omaha"
keywords = ["chromium", "omaha", "update", "crx"]

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
quick-xml = { version = "0.42", default-features = false }
omaha-protocol = { path = "crates/omaha-protocol", version = "0.1.0" }
crx3 = { path = "crates/crx3", version = "0.2.1" }
cup2 = { path = "crates/cup2", version = "0.2.1" }
omaha-diff = { path = "crates/omaha-diff", version = "0.0.1" }
omaha-server = { path = "crates/omaha-server", version = "0.0.1" }
omaha-publish = { path = "crates/omaha-publish", version = "0.0.1" }
chromium-testdata = { path = "support/chromium-testdata" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
