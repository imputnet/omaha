[workspace]
exclude = ["fuzz"]
resolver = "3"
members = ["crates/*", "support/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imputnet/omaha"
keywords = ["chromium", "omaha", "update", "crx"]

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = "0.2"
form_urlencoded = "1"
base64 = "0.22"
tempfile = "3"
zip = { version = "9", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
object_store = { version = "0.14", default-features = false }
clap = { version = "4", features = ["derive"] }
pem-rfc7468 = { version = "1", features = ["alloc"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
url = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-util = { version = "0.20", default-features = false }
quick-xml = { version = "0.42", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", default-features = false }
omaha-protocol = { path = "crates/omaha-protocol", version = "0.3.0" }
crx3 = { path = "crates/crx3", version = "1.0.0" }
cup2 = { path = "crates/cup2", version = "1.0.0", default-features = false }
omaha-diff = { path = "crates/omaha-diff", version = "0.1.2" }
omaha-server = { path = "crates/omaha-server", version = "0.1.5" }
omaha-publish = { path = "crates/omaha-publish", version = "0.2.0", default-features = false }
chromium-testdata = { path = "support/chromium-testdata" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
